<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">

  <!-- Ears -->
  <circle cx="118" cy="112" r="38" fill="#113320"/>
  <circle cx="282" cy="112" r="38" fill="#113320"/>
  <!-- Ear inner -->
  <circle cx="118" cy="112" r="22" fill="#1a4a2e"/>
  <circle cx="282" cy="112" r="22" fill="#1a4a2e"/>

  <!-- Body -->
  <rect x="80" y="148" width="240" height="220" rx="40" ry="40" fill="#113320"/>

  <!-- Head -->
  <circle cx="200" cy="148" r="88" fill="#113320"/>

  <!-- Belly oval -->
  <ellipse cx="200" cy="280" rx="72" ry="88" fill="#c2ffb4"/>

  <!-- Snout -->
  <ellipse cx="200" cy="180" rx="36" ry="28" fill="#1a4a2e"/>

  <!-- Eyes (hidden behind sunglasses — keep for structure alignment) -->
  <circle cx="170" cy="138" r="10" fill="#050e08"/>
  <circle cx="230" cy="138" r="10" fill="#050e08"/>

  <!-- Nose -->
  <ellipse cx="200" cy="170" rx="8" ry="6" fill="#050e08"/>

  <!-- Smile — slightly wider/cooler -->
  <path d="M180 188 Q200 204 220 188" stroke="#050e08" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="44" y="196" width="52" height="108" rx="26" ry="26" fill="#113320"/>
  <rect x="304" y="196" width="52" height="108" rx="26" ry="26" fill="#113320"/>

  <!-- Legs -->
  <rect x="118" y="340" width="60" height="88" rx="30" ry="30" fill="#113320"/>
  <rect x="222" y="340" width="60" height="88" rx="30" ry="30" fill="#113320"/>

  <!-- Feet -->
  <ellipse cx="148" cy="428" rx="36" ry="20" fill="#0d2918"/>
  <ellipse cx="252" cy="428" rx="36" ry="20" fill="#0d2918"/>

  <!-- ── SWAG ── -->

  <!-- Headphones arc over head -->
  <path d="M122 138 Q200 56 278 138" stroke="#e8e8e8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Headphone ear cups -->
  <rect x="108" y="130" width="22" height="30" rx="8" fill="#d0d0d0"/>
  <rect x="270" y="130" width="22" height="30" rx="8" fill="#d0d0d0"/>
  <!-- Cup padding -->
  <rect x="113" y="135" width="12" height="20" rx="4" fill="#a8a8a8"/>
  <rect x="275" y="135" width="12" height="20" rx="4" fill="#a8a8a8"/>

  <!-- Sunglasses bar bridge -->
  <rect x="159" y="131" width="82" height="5" rx="2.5" fill="#111"/>
  <!-- Left lens -->
  <rect x="136" y="126" width="54" height="34" rx="8" fill="#0a0a0a"/>
  <!-- Right lens -->
  <rect x="210" y="126" width="54" height="34" rx="8" fill="#0a0a0a"/>
  <!-- Lens shine glints -->
  <line x1="143" y1="133" x2="155" y2="133" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="217" y1="133" x2="229" y2="133" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Temple arms -->
  <line x1="136" y1="143" x2="112" y2="143" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <line x1="264" y1="143" x2="288" y2="143" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- Clapboard — held in right paw area -->
  <g transform="translate(296, 236)">
    <!-- Board body -->
    <rect x="0" y="18" width="60" height="48" rx="4" fill="#f0f0f0"/>
    <!-- Clapper top bar -->
    <rect x="0" y="8" width="60" height="14" rx="3" fill="#222"/>
    <!-- Clapper stripes -->
    <rect x="6"  y="8" width="8" height="14" fill="#f0f0f0"/>
    <rect x="22" y="8" width="8" height="14" fill="#f0f0f0"/>
    <rect x="38" y="8" width="8" height="14" fill="#f0f0f0"/>
    <rect x="54" y="8" width="4" height="14" fill="#f0f0f0"/>
    <!-- "ACTION" text on board -->
    <text x="30" y="38" text-anchor="middle" font-family="'Nunito Sans', sans-serif" font-weight="800" font-size="9" fill="#222" letter-spacing="1.5">ACTION</text>
    <!-- Line details -->
    <line x1="6" y1="46" x2="54" y2="46" stroke="#ccc" stroke-width="1"/>
    <line x1="6" y1="54" x2="54" y2="54" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- Label -->
  <text x="200" y="478" text-anchor="middle" font-family="'Times New Roman', serif" font-style="italic" font-size="13" fill="rgba(194,255,180,0.35)" letter-spacing="2">TEDDY — STYLED</text>

</svg>
