name: Refresh GAM dashboard figures
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: gam-dashboard-figures
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Refresh aggregate figures from dashboard
        run: python3 source/scripts/refresh_gam_stats.py published/humanitarian-tracker/data/stats.json
      - name: Publish updated snapshot
        working-directory: published
        run: |
          git config user.name 'Spotlight Dashboard Updates'
          git config user.email 'deployment@users.noreply.github.com'
          git add humanitarian-tracker/data/stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GAM dashboard figures'
            git push origin HEAD:gh-pages
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages/builds"
